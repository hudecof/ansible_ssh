---
- name: "Setup sshd_config.d directory"
  ansible.builtin.file:
    path: "{{ sshd_config_d_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: sshd_config_d | length > 0

- name: "Setup sshd_config.d files"
  ansible.builtin.template:
    src: sshd_config.j2
    dest: "{{ sshd_config_d_dir }}/{{ item.key }}.conf"
    backup: "{{ sshd_backup }}"
    owner: root
    group: root
    mode: "0640"
  vars:
    _sshd_directives: "{{ item.value | dict2items | rejectattr('key', 'eq', 'match') | items2dict }}"
    _sshd_match: "{{ item.value.match | default([]) }}"
  loop: "{{ sshd_config_d | dict2items }}"
  notify:
    - restart sshd
  when: sshd_config_d | length > 0

- name: "Disable sshd_config.d files"
  ansible.builtin.command:
    cmd: mv "{{ sshd_config_d_dir }}/{{ item }}.conf" "{{ sshd_config_d_dir }}/{{ item }}.conf.disabled"
    removes: "{{ sshd_config_d_dir }}/{{ item }}.conf"
  loop: "{{ sshd_config_d_disabled }}"
  notify:
    - restart sshd

- name: "Remove sshd_config.d files"
  ansible.builtin.file:
    path: "{{ sshd_config_d_dir }}/{{ item }}.conf"
    state: absent
  loop: "{{ sshd_config_d_absent }}"
  notify:
    - restart sshd

- name: "Remove sshd_config.d disabled markers"
  ansible.builtin.file:
    path: "{{ sshd_config_d_dir }}/{{ item }}.conf.disabled"
    state: absent
  loop: "{{ sshd_config_d_absent }}"
