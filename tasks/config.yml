---
- name: "Common | setup sshd_config.conf"
  ansible.builtin.template:
    src: sshd_config.j2
    dest: "{{ sshd_file_config }}"
    backup: "{{ sshd_backup }}"
    owner: root
    group: root
    mode: 0640
    validate: "{{ sshd_binary }} -t -f %s"
  vars:
    _sshd_directives: "{{ sshd_config }}"
    _sshd_config_order: "{{ sshd_config_order }}"
    _sshd_match: "{{ sshd_config_match }}"
  when: not sshd_test
  notify:
    - restart sshd

- name: "Common | setup sshd_config.conf"
  ansible.builtin.template:
    src: sshd_config.j2
    dest: "{{ sshd_file_config }}"
    backup: true
    owner: root
    group: root
    mode: 0640
  vars:
    _sshd_directives: "{{ sshd_config }}"
    _sshd_config_order: "{{ sshd_config_order }}"
    _sshd_match: "{{ sshd_config_match }}"
  when: sshd_test
  notify:
    - restart sshd
